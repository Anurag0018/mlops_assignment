name: MLOps Continuous Integration (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Data Engineering & ETL Pipeline
      run: |
        python src/transformation/transform.py

    - name: Run Feature Engineering
      run: |
        python src/features/build_features.py

    - name: Run Model Training & MLflow Logging
      run: |
        python src/training/train.py

    - name: Run Full Test Suite (Unit, Integration & Governance)
      run: |
        python -m pytest tests/ -v
