<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%" style="background:#0F172A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="gradIngest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="gradRaw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="gradValid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="gradRej" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="gradTrans" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="gradDB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="gradDash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94A3B8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title Section -->
  <text x="550" y="45" fill="#F8FAFC" font-size="24" font-weight="bold" text-anchor="middle">STUDENT PERFORMANCE DATA ENGINEERING ARCHITECTURE</text>
  <text x="550" y="70" fill="#94A3B8" font-size="14" text-anchor="middle">End-to-End Ingestion → Validation → Transformation → PostgreSQL Mart → Streamlit Dashboard</text>

  <!-- Orchestration Container Banner -->
  <rect x="50" y="95" width="1000" height="45" rx="8" fill="#1E293B" stroke="#475569" stroke-dasharray="4"/>
  <text x="550" y="123" fill="#E2E8F0" font-size="14" font-weight="600" text-anchor="middle">⚙️ Orchestrated by Apache Airflow DAG: student_data_pipeline (Daily Schedule &amp; Task Dependencies)</text>

  <!-- Node 1: Sources -->
  <g transform="translate(60, 180)" filter="url(#shadow)">
    <rect width="180" height="110" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="90" y="32" fill="#38BDF8" font-size="14" font-weight="bold" text-anchor="middle">1. DATA SOURCE</text>
    <text x="90" y="55" fill="#F8FAFC" font-size="13" font-weight="600" text-anchor="middle">UCI Student Dataset</text>
    <text x="90" y="75" fill="#94A3B8" font-size="11" text-anchor="middle">• student-mat.csv (395)</text>
    <text x="90" y="92" fill="#94A3B8" font-size="11" text-anchor="middle">• student-por.csv (649)</text>
  </g>

  <!-- Node 2: Ingestion -->
  <g transform="translate(300, 180)" filter="url(#shadow)">
    <rect width="180" height="110" rx="10" fill="url(#gradIngest)"/>
    <text x="90" y="32" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">2. DATA INGESTION</text>
    <text x="90" y="55" fill="#E0E7FF" font-size="12" text-anchor="middle">src/ingestion/ingest.py</text>
    <text x="90" y="75" fill="#FFFFFF" font-size="11" text-anchor="middle">• Delimiter detection</text>
    <text x="90" y="92" fill="#FFFFFF" font-size="11" text-anchor="middle">• Audit metadata log</text>
  </g>

  <!-- Node 3: Raw Layer -->
  <g transform="translate(540, 180)" filter="url(#shadow)">
    <rect width="170" height="110" rx="10" fill="url(#gradRaw)"/>
    <text x="85" y="32" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">3. RAW LAYER</text>
    <text x="85" y="55" fill="#CBD5E1" font-size="12" text-anchor="middle">data/raw/</text>
    <text x="85" y="75" fill="#F1F5F9" font-size="11" text-anchor="middle">• Immutable CSV copies</text>
    <text x="85" y="92" fill="#F1F5F9" font-size="11" text-anchor="middle">• ingestion_audit.json</text>
  </g>

  <!-- Node 4: Validation Engine -->
  <g transform="translate(770, 180)" filter="url(#shadow)">
    <rect width="190" height="110" rx="10" fill="url(#gradValid)"/>
    <text x="95" y="30" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">4. DATA VALIDATION</text>
    <text x="95" y="52" fill="#FEF3C7" font-size="12" text-anchor="middle">src/validation/validate.py</text>
    <text x="95" y="72" fill="#FFFFFF" font-size="11" text-anchor="middle">• Null &amp; Duplicate checks</text>
    <text x="95" y="88" fill="#FFFFFF" font-size="11" text-anchor="middle">• Grade ranges (0 - 20)</text>
    <text x="95" y="102" fill="#FFFFFF" font-size="11" text-anchor="middle">• Domain categorical sets</text>
  </g>

  <!-- Rejected Branch (Down from Validation) -->
  <g transform="translate(865, 360)" filter="url(#shadow)">
    <rect width="180" height="90" rx="10" fill="url(#gradRej)"/>
    <text x="90" y="28" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">QUARANTINED</text>
    <text x="90" y="48" fill="#FEE2E2" font-size="11" text-anchor="middle">data/rejected/</text>
    <text x="90" y="65" fill="#FFFFFF" font-size="11" text-anchor="middle">• rejected_records.csv</text>
    <text x="90" y="80" fill="#FFFFFF" font-size="10" text-anchor="middle">Includes reason &amp; timestamp</text>
  </g>

  <!-- Node 5: Staging Layer -->
  <g transform="translate(640, 360)" filter="url(#shadow)">
    <rect width="180" height="90" rx="10" fill="#334155" stroke="#94A3B8" stroke-width="2"/>
    <text x="90" y="28" fill="#F8FAFC" font-size="13" font-weight="bold" text-anchor="middle">5. STAGING LAYER</text>
    <text x="90" y="48" fill="#CBD5E1" font-size="11" text-anchor="middle">data/staging/</text>
    <text x="90" y="68" fill="#F8FAFC" font-size="11" text-anchor="middle">• staging_students.csv</text>
    <text x="90" y="82" fill="#94A3B8" font-size="10" text-anchor="middle">(1028 Validated Records)</text>
  </g>

  <!-- Node 6: Transformation Engine -->
  <g transform="translate(370, 350)" filter="url(#shadow)">
    <rect width="210" height="110" rx="10" fill="url(#gradTrans)"/>
    <text x="105" y="28" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">6. TRANSFORMATION</text>
    <text x="105" y="48" fill="#E9D5FF" font-size="12" text-anchor="middle">src/transformation/transform.py</text>
    <text x="105" y="68" fill="#FFFFFF" font-size="11" text-anchor="middle">• avg_grade, pass_fail</text>
    <text x="105" y="83" fill="#FFFFFF" font-size="11" text-anchor="middle">• performance_category</text>
    <text x="105" y="98" fill="#FFFFFF" font-size="11" text-anchor="middle">• attendance_rate &amp; risk_status</text>
  </g>

  <!-- Node 7: PostgreSQL Database -->
  <g transform="translate(90, 350)" filter="url(#shadow)">
    <rect width="220" height="110" rx="10" fill="url(#gradDB)"/>
    <text x="110" y="28" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle">7. POSTGRESQL DATABASE</text>
    <text x="110" y="48" fill="#CFFAFE" font-size="12" text-anchor="middle">Relational Schema &amp; Storage</text>
    <text x="110" y="68" fill="#FFFFFF" font-size="11" text-anchor="middle">• students (662 unique)</text>
    <text x="110" y="83" fill="#FFFFFF" font-size="11" text-anchor="middle">• academic_performance (1028)</text>
    <text x="110" y="98" fill="#FFFFFF" font-size="11" text-anchor="middle">• student_analytics (Data Mart)</text>
  </g>

  <!-- Node 8: Streamlit Dashboard -->
  <g transform="translate(240, 520)" filter="url(#shadow)">
    <rect width="600" height="130" rx="12" fill="url(#gradDash)"/>
    <text x="300" y="32" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">8. STREAMLIT INTERACTIVE DASHBOARD (dashboard/app.py)</text>
    <text x="300" y="55" fill="#D1FAE5" font-size="12" text-anchor="middle">5 Production-Ready Academic Decision-Support Views</text>
    <g transform="translate(30, 70)">
      <rect x="0" y="0" width="100" height="42" rx="6" fill="#065F46"/>
      <text x="50" y="18" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">View 1</text>
      <text x="50" y="32" fill="#A7F3D0" font-size="9" text-anchor="middle">Overall KPIs</text>

      <rect x="110" y="0" width="100" height="42" rx="6" fill="#065F46"/>
      <text x="160" y="18" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">View 2</text>
      <text x="160" y="32" fill="#A7F3D0" font-size="9" text-anchor="middle">Attendance</text>

      <rect x="220" y="0" width="100" height="42" rx="6" fill="#065F46"/>
      <text x="270" y="18" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">View 3</text>
      <text x="270" y="32" fill="#A7F3D0" font-size="9" text-anchor="middle">Subject Trends</text>

      <rect x="330" y="0" width="100" height="42" rx="6" fill="#065F46"/>
      <text x="380" y="18" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">View 4</text>
      <text x="380" y="32" fill="#A7F3D0" font-size="9" text-anchor="middle">Demographics</text>

      <rect x="440" y="0" width="100" height="42" rx="6" fill="#065F46"/>
      <text x="490" y="18" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">View 5</text>
      <text x="490" y="32" fill="#A7F3D0" font-size="9" text-anchor="middle">Student Drilldown</text>
    </g>
  </g>

  <!-- Connectors -->
  <line x1="240" y1="235" x2="295" y2="235" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="235" x2="535" y2="235" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="235" x2="765" y2="235" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Validation to Quarantined -->
  <path d="M 865 290 L 865 320 L 955 320 L 955 355" fill="none" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="965" y="335" fill="#EF4444" font-size="10" font-weight="bold">Violations</text>

  <!-- Validation to Staging -->
  <path d="M 800 290 L 800 325 L 730 325 L 730 355" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="740" y="335" fill="#10B981" font-size="10" font-weight="bold">Valid</text>

  <!-- Staging to Transformation -->
  <line x1="640" y1="405" x2="585" y2="405" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Transformation to PostgreSQL -->
  <line x1="370" y1="405" x2="315" y2="405" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PostgreSQL to Streamlit -->
  <path d="M 200 460 L 200 585 L 235 585" fill="none" stroke="#06B6D4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="210" y="530" fill="#06B6D4" font-size="10" font-weight="bold">SQL Queries</text>
</svg>
